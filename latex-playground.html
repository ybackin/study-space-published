<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaTeX 编辑器 Playground</title>
  <link rel="stylesheet" href="latex-playground.css">
  <script src="mathjax-config.js"></script>
  <script defer src="mathjax/tex-svg-full.js"></script>
  <script type="module" src="latex-playground.js"></script>
</head>
<body>
  <main class="playground">
    <header class="playground-header">
      <div>
        <h1>数学编辑器 Playground</h1>
        <p>独立测试区：不连接账号、笔记或数据库。</p>
      </div>
      <span class="playground-hint">直接写 LaTeX · 无需 $ 标记 · Tab 切换模板参数</span>
    </header>
    <div id="math-workbench-root"></div>
  </main>
</body>
</html>
