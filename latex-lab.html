<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公式编辑器独立测试</title>
  <link rel="stylesheet" href="katex.min.css">
  <link rel="stylesheet" href="latex-lab.css">
  <script src="katex.min.js" defer></script>
  <script type="module" src="latex-lab.js"></script>
</head>
<body>
  <main class="lab">
    <header><h1>公式编辑器测试</h1><p>独立于账号和笔记数据；用于验证源码、补全与实时预览。</p></header>
    <div class="toolbar"><div id="categories" class="categories"></div><button id="color-toggle" type="button">文字 / 公式颜色</button></div>
    <div id="symbols" class="symbols"></div>
    <div id="colors" class="colors" hidden></div>
    <div class="workbench"><section><h2>正文与公式</h2><div id="source-editor" class="source-editor" aria-label="正文与公式"></div></section><section><h2>实时预览</h2><div id="latex-preview" class="latex-preview"></div></section></div>
    <output id="status">就绪</output>
  </main>
</body>
</html>
